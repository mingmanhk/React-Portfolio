name: Deploy to GitHub Pages

# On every push to main: lint, build, run the quality gate, then publish.
# Pull requests (including Dependabot's) run the same checks without deploying.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read the repo, write only to Pages, and mint an OIDC token
# for the official deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch at a time; a newer push supersedes an in-progress one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

      # Chromium for the quality gate (accessibility, rendering, interactions).
      - run: npx playwright-core install --with-deps chromium

      - run: npm run check

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
